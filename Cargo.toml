[workspace]
resolver = "2"
members = [
    "crates/patchlens-core",
    "crates/patchlens-cli",
    "crates/patchlens-mcp",
    "crates/patchlens-report",
    "tools/make_fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["RivaExits0"]
repository = "https://github.com/RivaExits0/patchlens"

[workspace.dependencies]
goblin = { version = "0.7", features = ["pe64"] }
capstone = "0.13"
rayon = "1.10"
memchr = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
rmcp = { version = "0.2", features = ["server", "transport-io"] }
tokio = { version = "1.40", features = ["full"] }
once_cell = "1.19"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dashmap = "6.1"
insta = "1.34"
tempfile = "3.10"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true
